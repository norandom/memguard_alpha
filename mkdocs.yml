      - "2026-10-30 GPT-OSS-20B calibration and ETF evaluation on NIM": results/2026-10-30-nim-measurement.md
      - "2026-10-31 Completion API pilot - rewrite mitigation and three-draw ensemble with Opus": results/2026-10-31-completion-api-pilot.md
      - "2026-11-01 Anthropic completion-reweighting prototype": results/2026-11-01-anthropic-reweighting-prototype.md
      - "2026-11-01 FOMC statistical source - older/newer lexical signature": results/2026-11-01-fomc-statistical-signature.md
      - "2026-11-01 NIM refresh of GPT-OSS-20B calibration and ensembles": results/2026-11-01-nim-refresh.md
      - "2026-11-01 Lookahead evidence with ensembles": results/2026-11-01-recall-guard-ensemble.md
      - "2026-11-01 Lookahead evidence without ensembles": results/2026-11-01-recall-guard-single.md
