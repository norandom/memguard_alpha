  - Phase A single-draw calibration (2026-11-08): results/2026-11-08-phase-a-single-draw.md
  - Phi-4 Mini disqualified (2026-11-08): results/2026-11-08-phi4-mini-disqualified.md
  - Five local model logprob tests (2026-11-06): results/2026-11-06-local-model-smoke.md
  - Modal GPT-OSS evidence pilot (2026-11-06): results/2026-11-06-modal-pilot.md
  - GPT-OSS response mapping repair (2026-11-06): results/2026-11-06-gpt-oss-response-mapping.md
  - Optional Modal hosting: modal-provider.md
