site_name: recall_guard
site_description: Point-in-time inference from self-hosted language models for quantitative finance research, without lookahead bias.
repo_url: https://github.com/norandom/recall_guard
# Warnings (incl. unresolved references) are fatal, so a broken API reference fails
# the build rather than publishing a broken page (Req 8.5).
strict: true
# The reference generator is a build script, not a doc page — keep it out of site/.
# The papers folder holds third-party papers for reference; they are not pages of this site.
exclude_docs: |
  gen_ref_pages.py
  gen_benchmark_page.py
  papers/
  notebooks/figures/

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy

# Render ```mermaid fences as diagrams (Material's built-in Mermaid.js
# integration); without this they publish as plain code blocks.
# pymdownx.highlight turns on Pygments syntax highlighting for fenced
# code blocks; inlinehilite covers `#!python inline` spans.
markdown_extensions:
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
        - docs/gen_benchmark_page.py
  - literate-nav:
      nav_file: SUMMARY.md
  # Renders the committed notebooks under docs/notebooks as pages, with their stored outputs (no execution).
  - mkdocs-jupyter:
      execute: false
      include: ["notebooks/*.ipynb"]
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Use cases: use-cases.md
  - Notebooks:
    - Recall-adjusted answers in two modes: notebooks/recall_adjusted_answers.ipynb
    - Point-in-time prompt through the front: notebooks/pit_front.ipynb
    - Measurement flow: notebooks/flow.ipynb
    - Model qualification: notebooks/qualification.ipynb
    - Completion workflow: notebooks/completion_workflow.ipynb
    - Visualize a run: notebooks/visualize_run.ipynb
  - Guides:
    - Point-in-time architecture: guides/pit-architecture.md
    - Ensemble consensus: guides/ensemble.md
    - Local models: guides/local-provider.md
    - Rented GPUs on Modal: guides/modal-provider.md
