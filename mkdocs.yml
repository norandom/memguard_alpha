site_name: recall_guard
site_description: Measured inference-without-recall — per-prompt contamination scoring for LLM outputs.
repo_url: https://github.com/norandom/recall_guard
# Warnings (incl. unresolved references) are fatal, so a broken API reference fails
# the build rather than publishing a broken page (Req 8.5).
strict: true
# The reference generator is a build script, not a doc page — keep it out of site/.
exclude_docs: |
  gen_ref_pages.py
  gen_benchmark_page.py

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy

# Render ```mermaid fences as diagrams (Material's built-in Mermaid.js
# integration); without this they publish as plain code blocks.
# pymdownx.highlight turns on Pygments syntax highlighting for fenced
# code blocks; inlinehilite covers `#!python inline` spans.
markdown_extensions:
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
        - docs/gen_benchmark_page.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Research:
    - Research report: research-report.md
    - Research register: research-register.md
    - All reports: results/index.md
    - Report template: results/template.md
