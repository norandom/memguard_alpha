site_name: recall_guard
site_description: Measured inference-without-recall — honest LLM signals with a calibrated memorization score.
repo_url: https://github.com/norandom/memguard_alpha
# Warnings (incl. unresolved references) are fatal, so a broken API reference fails
# the build rather than publishing a broken page (Req 8.5).
strict: true
# The reference generator is a build script, not a doc page — keep it out of site/.
exclude_docs: |
  gen_ref_pages.py

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - API reference: reference/
