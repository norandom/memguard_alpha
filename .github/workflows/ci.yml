name: CI

# Thin control plane: GitHub Actions triggers; the Dagger module runs the steps,
# so CI and a local `dagger call` execute the exact same pipeline.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows:
    name: Windows (py${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test native Windows behavior
        run: uv run pytest -q
      - name: Check code and import boundaries
        run: |
          uv run ruff check .
          uv run python scripts/check_architecture.py

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.4 BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run test suite
        run: dagger -m ci call test --source=. --python=${{ matrix.python }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.4 BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Ruff
        run: dagger -m ci call lint --source=.
