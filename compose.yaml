x-development: &development
  image: recall-guard:dev
  build:
    context: .
    target: dev
  init: true
  working_dir: /app
  volumes:
    - &outputs
      type: bind
      source: ./runs/container
      target: /outputs
      bind:
        create_host_path: false

services:
  dev:
    <<: *development
    networks: [default, model-host]

  # Optional CPU model host for Docker Engine in WSL (D3): serves the checkout's
  # ignored models/ store read-only. No published port: only containers on the
  # internal model-host network reach it, as http://ollama:11434. Never pulls.
  ollama:
    image: ollama/ollama:0.40.11
    profiles: [ollama]
    init: true
    networks: [model-host]
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NOPRUNE: "1"
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
        bind:
          create_host_path: false

  notebook:
    <<: *development
    profiles: [notebook]
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - *outputs
      - type: bind
        source: ./notebooks
        target: /app/notebooks
        bind:
          create_host_path: false
    command:
      - uv
      - run
      - --no-sync
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.root_dir=/app
      - --ServerApp.preferred_dir=/app/notebooks

networks:
  # Internal: no route to Windows, the LAN or the internet.
  model-host:
    internal: true
