# Per-model training-cutoff registry for the honest-model-ranking harness.
#
# Purpose (Req 2.5, 3.1): the harness uses these dates as a fail-fast guard so
# the evaluation set and the OOS-control corpus only contain articles dated
# AFTER every shortlisted model's training cutoff. If a model's cutoff is
# recorded too early here, contaminated (memorisable) text leaks into the
# corpora and silently breaks every downstream statistical claim.
#
# Sourcing rules (do not relax):
#   1. Each date MUST come from the official model card / vendor docs.
#   2. Where a model documents both a pre-training and a post-training cutoff,
#      the LATER date is recorded -- post-training data is still memorisable.
#   3. Where the vendor states a month only (e.g. "December 2023"), the LAST
#      day of that month is used. This is the most conservative reading and
#      keeps the guard strict.
#   4. If neither the model card nor a verifiable upstream base-model card
#      gives a date, the model is OMITTED. The harness will then fail fast
#      with `CutoffViolation: missing from cutoffs registry` rather than
#      silently mis-evaluating it.
#
# Schema (consumed by src.core.loader.load_cutoffs):
#   models:
#     <model_id>: <ISO 8601 date>   # YAML parses bare YYYY-MM-DD as a date.

models:
  # --- Meta Llama 3.1 family (all three sizes share one cutoff) ---
  meta/llama-3.1-8b-instruct: 2023-12-31         # "Knowledge cutoff: December 2023" -- https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
  meta/llama-3.1-70b-instruct: 2023-12-31        # "Knowledge cutoff: December 2023" -- https://huggingface.co/meta-llama/Llama-3.1-70B-Instruct
  meta/llama-3.1-405b-instruct: 2023-12-31       # "Knowledge cutoff: December 2023" -- https://huggingface.co/meta-llama/Llama-3.1-405B-Instruct

  # --- Meta Llama 3.2 family (designated reference model is 1B) ---
  meta/llama-3.2-1b-instruct: 2023-12-31         # "Knowledge cutoff: December 2023" -- https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct
  meta/llama-3.2-3b-instruct: 2023-12-31         # "Knowledge cutoff: December 2023" -- https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct

  # --- Meta Llama 3.3 ---
  meta/llama-3.3-70b-instruct: 2023-12-31        # "The pretraining data has a cutoff of December 2023" -- https://huggingface.co/meta-llama/Llama-3.3-70B-Instruct

  # --- NVIDIA Nemotron variants ---
  # Llama-3.3-Nemotron-Super-49B-v1.5 inherits its pretraining cutoff from
  # Meta Llama 3.3 70B; vendor card says "The pretraining data has a cutoff
  # of 2023 per Meta Llama 3.3 70B". Recorded as last day of 2023.
  nvidia/llama-3.3-nemotron-super-49b-v1.5: 2023-12-31  # https://huggingface.co/nvidia/Llama-3_3-Nemotron-Super-49B-v1_5
  # NVIDIA-Nemotron-Nano-9B-v2 trained from scratch by NVIDIA. Card states
  # "The pretraining data has a cutoff date of September 2024."
  nvidia/nvidia-nemotron-nano-9b-v2: 2024-09-30  # https://huggingface.co/nvidia/NVIDIA-Nemotron-Nano-9B-v2
  # Nemotron-3-Super-120B-A12B documents BOTH "pre-training data has a cutoff
  # date of June 2025" AND "post-training data has a cutoff date of February
  # 2026" (specifically February 24, 2026). The post-training data is still
  # memorisable, so the LATER date is the correct guard.
  nvidia/nemotron-3-super-120b-a12b: 2026-02-24  # https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16

  # --- OpenAI gpt-oss series (NVIDIA-hosted) ---
  # Both 20B and 120B share one cutoff. Section 2.4 of the gpt-oss model card
  # paper states: "Our model has a knowledge cutoff of June 2024."
  openai/gpt-oss-20b: 2024-06-30   # https://arxiv.org/html/2508.10925v1
  openai/gpt-oss-120b: 2024-06-30  # https://arxiv.org/html/2508.10925v1

  # --- Microsoft Phi-4-mini-instruct ---
  # Card: "This is a static model trained on offline datasets with the
  # cutoff date of June 2024 for publicly available data."
  microsoft/phi-4-mini-instruct: 2024-06-30  # https://huggingface.co/microsoft/Phi-4-mini-instruct

  # --- OMITTED (no verifiable cutoff documented) ---
  # mistralai/mixtral-8x22b-instruct-v0.1 -- Mistral's official model card on
  #   Hugging Face (https://huggingface.co/mistralai/Mixtral-8x22B-Instruct-v0.1)
  #   does not document a training-data cutoff. Third-party aggregators give
  #   conflicting dates. Omitted by policy: the harness will fail-fast on this
  #   model rather than silently use a fabricated date.
  # qwen/qwen3-next-80b-a3b-instruct -- Qwen's model card
  #   (https://huggingface.co/Qwen/Qwen3-Next-80B-A3B-Instruct) describes
  #   "Pretraining (15T tokens) & Post-training" but does not state a cutoff
  #   date. Omitted by policy.
