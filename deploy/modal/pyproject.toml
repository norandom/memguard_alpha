[project]
name = "recall-guard-modal-deployment"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "modal==1.6.3",
    "recall-guard",
    "transformers==4.55.4",
    "huggingface-hub==0.34.4",
    "jinja2==3.1.6",
]

[tool.uv]
package = false

[tool.uv.sources]
recall-guard = { path = "../..", editable = true }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
